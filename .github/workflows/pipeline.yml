name: Execução Mensal do Pipeline Quantitativo

on:
  schedule:
    # Roda todo dia 1º de cada mês às 03:00 UTC (Meia-noite no Brasil)
    - cron: '0 3 1 * *'
  workflow_dispatch: # Botão  para rodar manualmente quando quiser

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas
      run: pip install -r requirements.txt

    - name: Orquestrar Pipeline (Coleta, Features e Modelo)
      env:
        # Injeção segura das chaves de API guardadas no GitHub Secrets
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
      run: python main.py

    - name: Salvar Resultados (Commit e Push)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Adiciona a pasta de dados inteira e a pasta de imagens
        git add data/
        git add image/
        
        git commit -m "Pipeline rodou: Novos dados, features e modelos treinados" || echo "Sem mudanças para commitar"
        git push